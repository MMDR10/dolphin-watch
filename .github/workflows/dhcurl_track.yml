name: 🐬 dH_curl Track (GFS v8 + ERA5 CDS)

on:
  schedule:
    - cron: '40 3,9,15,21 * * *'   # 每 6h 跟 advisory 同步
  workflow_dispatch:
    inputs:
      date:
        description: 'Date YYYYMMDD (GFS cycle)'
        required: false
        default: ''
      hour:
        description: 'Hour 00/06/12/18'
        required: false
        default: ''
      lat:
        description: 'Center latitude hint'
        required: false
        default: ''
      lon:
        description: 'Center longitude hint'
        required: false
        default: ''

jobs:
  dhcurl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (GFS v8 engine + ERA5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          pip install numpy eccodes cfgrib xarray cdsapi netCDF4

      - name: Determine target cycle & center hint
        id: target
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
            HOUR="${{ github.event.inputs.hour }}"
          else
            # 自動揀最接近嘅 synoptic hour（同本地 cron 邏輯一致）
            H=$(date -u +%H)
            if [ "$H" -ge 21 ]; then CYCLE="18"
            elif [ "$H" -ge 15 ]; then CYCLE="12"
            elif [ "$H" -ge 9 ]; then CYCLE="06"
            elif [ "$H" -ge 3 ]; then CYCLE="00"
            else CYCLE="18"; fi
            DATE=$(date -u +%Y%m%d)
            if [ "$CYCLE" = "18" ] && [ "$H" -lt 3 ]; then
              DATE=$(date -u -d '1 day ago' +%Y%m%d)
            fi
            HOUR="$CYCLE"
          fi
          # 中心 hint：優先 dispatch 輸入，其次 history 最新中心，最後 default
          if [ -n "${{ github.event.inputs.lat }}" ]; then
            LAT="${{ github.event.inputs.lat }}"
            LON="${{ github.event.inputs.lon }}"
          elif [ -f dhcurl_history.json ]; then
            LAT=$(python3 -c "import json; h=json.load(open('dhcurl_history.json')); print(h['records'][-1]['center_lat'])" 2>/dev/null || echo 16.5)
            LON=$(python3 -c "import json; h=json.load(open('dhcurl_history.json')); print(h['records'][-1]['center_lon'])" 2>/dev/null || echo 165.5)
          else
            LAT=16.5
            LON=165.5
          fi
          echo "TARGET_DATE=$DATE" >> "$GITHUB_OUTPUT"
          echo "TARGET_HOUR=$HOUR" >> "$GITHUB_OUTPUT"
          echo "TARGET_LAT=$LAT" >> "$GITHUB_OUTPUT"
          echo "TARGET_LON=$LON" >> "$GITHUB_OUTPUT"

      - name: Run GFS dH_curl (v8 physical helicity)
        id: gfs
        continue-on-error: true
        env:
          DATE: ${{ steps.target.outputs.TARGET_DATE }}
          HOUR: ${{ steps.target.outputs.TARGET_HOUR }}
          LAT: ${{ steps.target.outputs.TARGET_LAT }}
          LON: ${{ steps.target.outputs.TARGET_LON }}
        run: |
          python dolphin_dhcurl_v8.py \
              --date "$DATE" --hour "$HOUR" \
              --lat "$LAT" --lon "$LON" \
              --core 5.0 --shell 10.0 \
              --output dhcurl_result.json \
              --mode auto 2>&1
          echo "GFS_OK=1" >> "$GITHUB_ENV"

      - name: Run ERA5 dH_curl (CDS fallback, 5-day latency)
        if: steps.gfs.outcome == 'failure'
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            EXTRA="--date ${{ github.event.inputs.date }} --hour ${{ github.event.inputs.hour }} --lat ${{ github.event.inputs.lat }} --lon ${{ github.event.inputs.lon }}"
          else
            EXTRA="--era5-latest"
          fi
          python cds_dhcurl.py $EXTRA --output dhcurl_result.json
          echo "ERA5_OK=1" >> "$GITHUB_ENV"

      - name: Print result
        run: |
          python -c "
          import json
          d=json.load(open('dhcurl_result.json'))
          print(f'dH_curl: {d[\"dh_curl\"]:.6e} s⁻¹')
          print(f'Centre: {d[\"center_lat\"]:.2f}°N {d[\"center_lon\"]:.2f}°E')
          print(f'Mode: {d[\"mode\"]}')
          "

      - name: Commit dH_curl result
        if: success() || steps.gfs.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Dolphin-Watch Bot"
          git config user.email "bot@dolphin-watch.local"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/MMDR10/dolphin-watch.git
          git add dhcurl_result.json dhcurl_history.json
          git diff --staged --quiet || (
            git commit -m "🐬 dH_curl: auto-track $(date -u '+%Y-%m-%d %H:%M UTC')" &&
            git push
          )
