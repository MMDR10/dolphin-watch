name: 🐬 Dolphin Watch Auto-Update

on:
  schedule:
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Dolphin auto-update
        run: python3 dolphin_auto_update.py

      - name: Commit & Push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Dolphin-Watch Bot"
          git config user.email "bot@dolphin-watch.local"
          git add dashboard_data.json history.json dhcurl_result.json
          git diff --staged --quiet || (
            git commit -m "🐬 Auto: $(date -u '+%Y-%m-%d %H:%M UTC')"
          )
          git diff --staged --quiet && exit 0
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $i"
              exit 0
            fi
            echo "⚠️ Push attempt $i failed, pulling + retrying..."
            git pull --rebase origin main || true
            sleep $((i * 3))
          done
          echo "❌ Push failed after 5 attempts"
          exit 1
